# API deploy to Google Cloud Run (europe-west1). Manual trigger only until the
# production infrastructure exists; the runbook for turning it on is in CI.md
# ("API deploy"). Order: build image, run database migrations, deploy. A failed
# migration stops the run before anything is deployed.
name: API deploy

on:
  workflow_dispatch:

# One deploy at a time, so two runs never migrate the database concurrently.
concurrency:
  group: api-deploy
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: depanini-api
  # Artifact Registry repository, e.g. europe-west1-docker.pkg.dev/<project>/depanini
  IMAGE_REPO: ${{ vars.GCP_ARTIFACT_REPO }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Holds the production DATABASE_URL secret; add required reviewers to this
    # environment in the repo settings for an approval gate.
    environment: production
    permissions:
      contents: read
      id-token: write # Workload Identity Federation, so no JSON key in secrets
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "${IMAGE_REPO}/${SERVICE}:${GITHUB_SHA}" .
          docker push "${IMAGE_REPO}/${SERVICE}:${GITHUB_SHA}"

      # Migrations run from the runner against the production database, before
      # the new revision is deployed. Provider-agnostic: any Postgres with
      # PostGIS reachable over the internet (Neon, Supabase, Cloud SQL, ...).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @depanini/api...

      - name: Run database migrations
        run: scripts/api-migrate.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
