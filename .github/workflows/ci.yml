# Quality gates for the whole monorepo: lint, typecheck and tests for the
# mobile app, the API and the shared package. Runs on every pull request, and
# on pushes to `develop` through eas-build.yml, which calls it and only queues
# the mobile builds once it passes.
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    # The API e2e tests run against real Postgres + PostGIS (same image as docker-compose.yml).
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: depanini
          POSTGRES_PASSWORD: depanini
          POSTGRES_DB: depanini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U depanini -d depanini"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://depanini:depanini@localhost:5432/depanini_test
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm turbo run lint typecheck test

      # Node test runner for the helper scripts in scripts/. They need no
      # emulator or network in CI, so there is nothing to skip.
      - run: pnpm test:scripts
