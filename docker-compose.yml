# Local development database: Postgres + PostGIS.
#   pnpm db:up     → start (data persists in the `pgdata` volume)
#   pnpm db:down   → stop
# A fixed project name, so git worktrees (e.g. agent worktrees) share this one
# database instead of each creating its own container on the same port.
name: depanini-app

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: depanini
      POSTGRES_PASSWORD: depanini
      POSTGRES_DB: depanini
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U depanini -d depanini']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
