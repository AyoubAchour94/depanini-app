packages:
  - apps/*
  - packages/*

# React Native's native autolinking (Gradle/CocoaPods) is most reliable with a
# flat node_modules. Expo supports isolated installs since SDK 54, but some
# native libraries (Firebase, Mapbox) still resolve paths assuming hoisting.
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.11'
  - '@expo/schema-utils@58.0.2'
  - expo-modules-core@58.0.22
  - expo-modules-jsi@58.0.15
  - expo-router@58.0.23
  - expo@58.0.14
  - expo-build-properties@58.0.11
  - expo-dev-client@58.0.14
  - expo-dev-launcher@58.0.14
  - expo-image-manipulator@58.0.15

nodeLinker: hoisted

# Dependency install scripts are opt-in. None of these are needed at runtime.
allowBuilds:
  '@firebase/util': false
  protobufjs: false
  esbuild: true # verifies the platform binary (used by drizzle-kit)
  '@parcel/watcher': true # native file watcher used by Metro tooling
  unrs-resolver: true # verifies the native resolver binary (eslint-plugin-import)
